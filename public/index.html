<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baraka import system</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4;--panel:#FFFFFF;--ink:#16202E;--muted:#5B6676;--line:#D5DBE3;
  --accent:#1E5F83;--accent-soft:#E3EEF4;--danger:#A32D2D;--ok:#1E6B4F;
  --font:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10151C;--panel:#18202A;--ink:#E6EAF0;--muted:#9AA5B4;--line:#2C3643;--accent:#7DB7D8;--accent-soft:#1B2C38;--danger:#F09595;--ok:#7FD1AE;}
}
:root[data-theme="dark"]{--bg:#10151C;--panel:#18202A;--ink:#E6EAF0;--muted:#9AA5B4;--line:#2C3643;--accent:#7DB7D8;--accent-soft:#1B2C38;--danger:#F09595;--ok:#7FD1AE;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:17px;font-weight:600;margin:0 16px 0 0;letter-spacing:-.01em}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.btn{padding-right:28px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}.status.ok{color:var(--ok)}
.layout{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:0;min-height:calc(100% - 60px)}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.form{padding:16px 20px 60px;border-right:1px solid var(--line);background:var(--panel)}
.sec{padding:14px 0}
.docsec{border:1px solid var(--line);border-top:4px solid var(--sc);border-radius:10px;padding:12px 14px 14px;margin:14px 0;background:var(--panel);transition:box-shadow .15s}
.docsec.on{box-shadow:0 0 0 2px var(--sc)}
.docsec .sec-head .n{background:var(--sc);color:#fff}
.sec-head .n.lock{background:var(--bg);font-size:11px}
.prints{font-size:12px;color:var(--muted)}
.subh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;font-size:13px;font-weight:600;border-top:1px dashed var(--line);padding-top:10px}
.sec-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.sec-head h2{font-size:14px;font-weight:600;margin:0;flex:1}
.sec-head .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.rows input,.rows select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 8px;font-size:14px;color:var(--ink);width:100%;min-width:0}
label.f textarea{resize:vertical;min-height:54px}
.mini{font-size:12.5px;padding:4px 9px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:relative;background:var(--panel)}
.row .c2{grid-column:span 2}.row .c3{grid-column:span 3}.row .c4{grid-column:span 4}.row .c6{grid-column:span 6}
.row label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.row .x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.row .x:hover{color:var(--danger)}
.row .rn{grid-column:span 6;font-size:12px;font-weight:600;color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.preview{padding:16px 20px 60px;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tab{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#111}}
.paper-wrap{overflow-x:auto;padding-bottom:8px}
.paper{background:#fff;color:#111;width:794px;min-height:1000px;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06);padding:44px 48px}
.wb-pick{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.check{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--accent-soft);font-size:13px}
.check.bad{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.check ul{margin:4px 0 0;padding-left:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.appsw{display:flex;gap:4px;align-items:center;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.appsw b{font-size:14px;margin-right:12px}
.appsw button{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.appsw button[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.links{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px;background:var(--bg)}
.links .lk{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:4px 0}
.links .lk+.lk{border-top:1px dashed var(--line)}
:is(#opApp,#fcyApp,#declApp){
  
  --bg:#EEF1F4;--panel:#FFFFFF;--ink:#16202E;--muted:#5B6676;--line:#D5DBE3;--accent:#1E5F83;--accent-soft:#E3EEF4;

  --red:#F7C1C1;--red-bg:#501313;--amber:#FAC775;--amber-bg:#412402;--green:#C0DD97;--green-bg:#173404;--blue:#B5D4F4;--blue-bg:#042C53;--purple:#CECBF6;--purple-bg:#26215C;--teal:#9FE1CB;--teal-bg:#04342C;--gray:#D3D1C7;--gray-bg:#2C2C2A;--plan:#5FA3C9;--add:#EFA94A}}

  --red:#F7C1C1;--red-bg:#501313;--amber:#FAC775;--amber-bg:#412402;--green:#C0DD97;--green-bg:#173404;--blue:#B5D4F4;--blue-bg:#042C53;--purple:#CECBF6;--purple-bg:#26215C;--teal:#9FE1CB;--teal-bg:#04342C;--gray:#D3D1C7;--gray-bg:#2C2C2A;--plan:#5FA3C9;--add:#EFA94A}

/* ===== professional theme ===== */
body{background:#F4F6F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
:root[data-theme="dark"] body{background:var(--bg)}
.appsw{background:#12324A;border:0;padding:0 20px;min-height:58px;gap:14px;color:#fff;flex-wrap:nowrap}
.appsw .brand{display:flex;align-items:center;gap:10px;margin-right:14px;flex:none}
.appsw .mark{width:32px;height:32px;border-radius:7px;background:#F2A516;color:#12324A;font-weight:700;display:grid;place-items:center;font-size:17px}
.appsw .brand b{display:block;font-size:15px;color:#fff;margin:0;letter-spacing:.01em}
.appsw .brand div span{display:block;font-size:11.5px;color:#9FB8C8}
.apptabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto;scrollbar-width:none}
.appsw .apptabs button{background:none;border:0;border-radius:0;color:#C9D8E2;padding:0 14px;font-size:14px;border-bottom:3px solid transparent;min-height:58px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.appsw .apptabs button i{font-style:normal;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11.5px;font-weight:600}
.appsw .apptabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
.appsw .apptabs button[aria-current="true"]{color:#fff;border-bottom-color:#F2A516;background:rgba(255,255,255,.07);font-weight:600}
.appsw .apptabs button[aria-current="true"] i{background:#F2A516;color:#12324A}
.appsw .apptabs button:focus-visible{outline:2px solid #F2A516;outline-offset:-2px}
.appright{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.appsw .hbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;padding:6px 14px;font-size:13.5px;position:relative;cursor:pointer}
.appsw .hbtn:hover{background:rgba(255,255,255,.08)}
.appsw .hbtn.due::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#F2A516;border:2px solid #12324A}
.appsw #fbUser{color:#C9D8E2!important;margin-left:0!important}
.appsw #fbUser button{color:#fff!important;background:transparent!important;border-color:rgba(255,255,255,.35)!important;border-radius:6px!important}
@media (max-width:980px){.appsw .brand span{display:none}.appsw .brand div{display:none}.appsw .apptabs button{padding:0 10px;font-size:13px}}
.bar{padding:12px 20px;box-shadow:0 1px 0 var(--line)}
.bar h1{font-size:17px;font-weight:600}
:is(#opApp,#fcyApp,#declApp) main{padding-top:20px}
:is(#opApp,#fcyApp,#declApp) .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
:is(#opApp,#fcyApp,#declApp) .kpi{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:14px 16px;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;border-left:3px solid var(--line)}
:is(#opApp,#fcyApp,#declApp) .kpi span{font-size:12.5px;line-height:1.35}
:is(#opApp,#fcyApp,#declApp) .kpi b{font-size:26px;letter-spacing:-.01em}
:is(#opApp,#fcyApp,#declApp) .kpi.alert{border-left-color:var(--red)}
:is(#opApp,#fcyApp,#declApp) .card{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
:is(#opApp,#fcyApp,#declApp) .card h2{font-size:14.5px}
:is(#opApp,#fcyApp,#declApp) table.t thead th{background:var(--bg);border-bottom:1px solid var(--line);padding:9px 8px}
:is(#opApp,#fcyApp,#declApp) table.t thead th:first-child{border-top-left-radius:6px}
:is(#opApp,#fcyApp,#declApp) table.t thead th:last-child{border-top-right-radius:6px}
:is(#opApp,#fcyApp,#declApp) table.t td{padding:10px 8px}
:is(#opApp,#fcyApp,#declApp) .nav button{font-size:14px}
:is(#opApp,#fcyApp,#declApp) .btn,.btn{border-radius:6px}
:is(#opApp,#fcyApp,#declApp) .chip{font-weight:500;letter-spacing:.01em}
:is(#opApp,#fcyApp,#declApp) dialog{border-radius:10px}
#docApp .form{box-shadow:1px 0 0 var(--line)}
#docApp .bar{gap:8px;flex-wrap:wrap}#docApp .bar .btn{padding:6px 11px;font-size:13.5px}#docApp .bar select.btn{max-width:210px}
#docApp .docsec{box-shadow:0 1px 2px rgba(16,24,40,.05)}
/* backup window */
#bkDlg{border:0;border-radius:12px;padding:0;width:min(660px,94vw);max-height:90vh;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
#bkDlg::backdrop{background:rgba(10,15,25,.45)}
.bk-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.bk-h h2{font-size:16px;margin:0}
#bkBody{padding:4px 18px;max-height:66vh;overflow:auto}
.bk-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.bk-sec:last-child{border-bottom:0}
.bk-sec h3{font-size:14px;margin:0 0 6px}
.bk-sec p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.bk-last{color:var(--ink)!important}
.bk-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bk-counts div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.bk-counts b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.bk-counts span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.bk-counts{grid-template-columns:1fr 1fr}}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bk-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.bk-btn.primary{background:#1E5F83;border-color:#1E5F83;color:#fff}
.bk-btn.warn{color:#A32D2D;border-color:#A32D2D}
.bk-btn:disabled{opacity:.5;cursor:not-allowed}
.bk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bk-note{font-size:12.5px!important;margin:8px 0 0!important}
.bk-due{background:#FAEEDA;color:#854F0B;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500}
.bk-msg{padding:10px 18px 14px;font-size:13.5px;min-height:20px;color:var(--muted)}
.bk-msg.ok{color:#27500A}.bk-msg.err{color:#A32D2D}
</style>

</head>
<body>
<header class="appsw"><div class="brand"><span class="mark" aria-hidden="true">B</span><div><b>Baraka Import System</b><span>Baraka Solar Manufacturing PLC</span></div></div>
<nav class="apptabs" aria-label="Switch part"><button data-app="plan"><i>1</i>Order plan</button><button data-app="docs"><i>2</i>Documents</button><button data-app="fcy"><i>3</i>FCY &amp; bank permit</button><button data-app="decl"><i>4</i>Declarations</button></nav>
<div class="appright"><button type="button" class="hbtn" id="backupBtn">Backup</button></div></header>
<dialog id="bkDlg" aria-labelledby="bkTitle"><div class="bk-h"><h2 id="bkTitle">Backup and restore</h2><button type="button" class="bk-btn" id="bkClose">Close</button></div><div id="bkBody"></div><div class="bk-msg" id="bkMsg" role="status"></div></dialog>
<div id="opApp" hidden>
<div class="bar">
  <h1>Order plan</h1>
  <nav class="nav" aria-label="Sections">
    <button data-view="dash" aria-current="page">Dashboard</button>
    <button data-view="plan">Order plan</button>
    <button data-view="containers">Containers</button>
    <button data-view="permits">Permits &amp; declarations</button>
    <button data-view="products">Products</button>
    <button data-view="settings">Settings</button>
  </nav>
  <span class="grow"></span>
  <span class="status" id="opStatus" role="status">Loading…</span>
  <button class="btn" id="addExtra">Add additional order</button>
  <button class="btn primary" id="addOrder">Add planned order</button>
</div>
<main id="opMain"></main>

<dialog id="dlg" aria-labelledby="dlgTitle"><form method="dialog" id="dlgForm" onsubmit="return false"></form></dialog>

</div>
<div id="fcyApp" hidden>
<div class="bar">
  <h1>FCY &amp; bank permit</h1>
  <nav class="nav" aria-label="Filter">
    <button data-tab="progress" aria-current="page">In progress</button>
    <button data-tab="done">Permit issued</button>
    <button data-tab="all">All proformas</button>
  </nav>
  <span class="grow"></span>
  <span class="status" id="fcyStatus" role="status">Loading…</span>
</div>
<main id="fcyMain"></main>
<dialog id="fcyDlg" aria-labelledby="fcyDlgTitle"><form method="dialog" id="fcyForm" onsubmit="return false"></form></dialog>
</div>
<div id="declApp" hidden>
<div class="bar">
  <h1>Declarations &amp; delinquency</h1>
  <nav class="nav" aria-label="Filter">
    <button data-tab="open" aria-current="page">Not submitted</button>
    <button data-tab="delinquent">Delinquent</button>
    <button data-tab="due">Due soon</button>
    <button data-tab="submitted">Submitted</button>
    <button data-tab="all">All</button>
  </nav>
  <span class="grow"></span>
  <span class="status" id="declStatus" role="status">Loading…</span>
  <button class="btn primary" id="declAdd">Add declaration</button>
</div>
<main id="declMain"></main>
<dialog id="declDlg" aria-labelledby="declDlgTitle"><form method="dialog" id="declForm" onsubmit="return false"></form></dialog>
</div>
<div id="docApp">
<div class="bar">
  <h1>Documents</h1>
  <select class="btn" id="openSel" aria-label="Open a saved shipment"><option value="">Saved shipments…</option></select>
  <button class="btn" id="newBtn">New shipment</button>
  <button class="btn" id="dupBtn" title="Keep parties and terms, clear numbers, items and containers">New from this</button>
  <button class="btn primary" id="saveBtn">Save shipment</button>
  <button class="btn" id="delShip" style="color:var(--danger);border-color:var(--danger)">Delete</button>
  <span class="grow"></span>
  <span class="status" id="status" role="status"></span>
  <button class="btn" id="dlOne">Download PDF</button>
  <button class="btn" id="dlHtml" title="Backup: a print-ready page. Open it and use Print, then Save as PDF">Print version</button>
  <button class="btn primary" id="dlAll" title="Proforma, commercial invoice, packing list and all truck waybills">Download all (PDF)</button>
</div>

<div class="layout">
  <form class="form" id="form" autocomplete="off" onsubmit="return false"></form>
  <section class="preview" aria-label="Document preview">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="checks"></div>
    <div class="paper-wrap"><div class="paper" id="paper"></div></div>
  </section>
</div>

</div>

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function blankItem(){return {desc:"",hs:"",qty:"",unit:"SET",origin:"",price:"",pkgs:"",pkgType:"PKG",net:"",gross:"",cbm:"",container:""}}
function blankContainer(){return {no:"",seal:"",type:"40HC",truck:"",trailer:"",driver:"",phone:"",license:""}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0}
function money(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function nf2(n){return n.toLocaleString("en-US",{maximumFractionDigits:2})}
function qtyf(n){return n.toLocaleString("en-US",{maximumFractionDigits:3})}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function fmtDate(s){if(!s)return "";var p=s.split("-");if(p.length!==3)return s;return p[2]+"/"+p[1]+"/"+p[0]}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){if(!s||!n)return "";var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+(+n));return ymd(d)}
function ciNo(d){return d.ciNo||d.piNo||""}
function setStatus(t,cls){var s=document.getElementById("status");s.textContent=t;s.className="status"+(cls?" "+cls:"")}

/* ---------- form ---------- */
function fieldHtml(f){
  var key=f[0],label=f[1],type=f[2]||"text",extra=f[3],cls=f[4]||"";
  var v=esc(state[key]);var hint=(typeof extra==="string"&&extra)?' placeholder="'+esc(extra)+'"':"";
  var inner;
  if(type==="calc")inner='<div id="'+key+'" style="padding:6px 8px;border:1px dashed var(--line);border-radius:5px;font-size:14px;color:var(--ink)">—</div>';
  else if(type==="logo")inner='<span style="display:flex;gap:6px;align-items:center">'+(state[key]?'<img src="'+v+'" alt="" style="height:30px;max-width:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px">':'')+'<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-logo="'+key+'" style="font-size:12px;min-width:0">'+(state[key]?'<button type="button" class="btn mini" data-clearlogo="'+key+'">Remove</button>':'')+'</span>';
  else if(type==="bank")inner='<span style="display:flex;gap:6px"><input data-k="'+key+'" list="bankList" value="'+v+'" placeholder="Choose or type a bank" style="flex:1"><button type="button" class="btn mini" id="saveBank" title="Remember this address for this bank">Save address</button></span>';
  else if(type==="color")inner='<input data-k="'+key+'" type="color" value="'+v+'" style="height:34px;padding:2px">';
  else if(type==="textarea")inner='<textarea data-k="'+key+'" rows="2">'+v+'</textarea>';
  else if(type==="select")inner='<select data-k="'+key+'">'+extra.map(function(o){return '<option'+(o===state[key]?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>';
  else inner='<input data-k="'+key+'" type="'+type+'" value="'+v+'"'+hint+(type==="number"?' step="any" inputmode="decimal"':"")+'>';
  return '<label class="f '+cls+'">'+esc(label)+inner+'</label>';
}
function buildForm(){
  var h="",n=0;
  SECTIONS.forEach(function(s){
    var st=s.color?' style="--sc:'+s.color+'"':'';
    h+='<div class="sec'+(s.doc?' docsec':'')+'" id="sec-'+s.id+'"'+(s.doc?' data-doc="'+s.doc+'"':'')+st+'><div class="sec-head">'+(s.doc?'<span class="n">'+(++n)+'</span>':'<span class="n lock" aria-hidden="true">&#128274;</span>')+'<div style="flex:1"><h2>'+esc(s.title)+'</h2>'+(s.prints?'<div class="prints">'+esc(s.prints)+'</div>':'')+'</div>';
    if(s.doc)h+='<button type="button" class="btn mini" data-show="'+s.doc+'">Preview</button>';
    if(s.po)h+='<button type="button" class="btn mini" id="saveCompany">Save as default</button>';
    h+='</div>';
    if(s.fixed)h+='<div style="font-size:13px;line-height:1.55;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)"><b>Vendor:</b> '+esc(FIXED.sName)+', '+esc(FIXED.sCountry)+'<br><b>Bank:</b> '+esc(FIXED.sBank)+', A/C '+esc(FIXED.sAccount)+', SWIFT '+esc(FIXED.sSwift)+'<br><b>Buyer:</b> '+esc(FIXED.bName)+', TIN '+esc(FIXED.bTin)+', Tel '+esc(FIXED.bPhone)+'<br><b>Validity:</b> '+FIXED.piValidity+' days &nbsp; <b>Payment:</b> '+FIXED.payTerms+' &nbsp; <b>Partial:</b> '+FIXED.partial+'<br><b>Delivery:</b> FCA &nbsp; <b>Shipment:</b> truck from Djibouti &nbsp; <b>Destination:</b> '+FIXED.dest+'<div class="hint" style="margin-top:6px">These print the same on every document and cannot be changed here.</div></div>';
    if(s.fields)h+='<div class="grid">'+s.fields.map(fieldHtml).join("")+'</div>';
    if(s.items==="main")h+='<div class="links" id="piLinks"></div>';
    if(s.items==="main")h+='<div class="subh"><span>Items</span><button type="button" class="btn mini" id="addItem">Add item</button></div><div class="rows" id="itemRows"></div>';
    if(s.items==="pack")h+='<div class="subh"><span>Packages and weights per item</span></div><div class="rows" id="packRows"></div>';
    if(s.containers)h+='<div class="subh"><span>Trucks (optional)</span><button type="button" class="btn mini" id="addCont">Add truck</button></div><div class="rows" id="contRows"></div><p class="hint">Leave empty for one waybill per shipment. With more than one truck, a separate waybill is made for each, and you choose below which truck carries each item.</p><div class="rows" id="assignRows"></div>';
    h+='</div>';
  });

/* ---------- totals and words ---------- */
function totals(d){
  var sub=0,pk=0,net=0,gr=0,cbm=0;
  d.items.forEach(function(it){sub+=num(it.qty)*num(it.price);pk+=num(it.pkgs);net+=num(it.net);gr+=num(it.gross);cbm+=num(it.cbm)});
  var fr=/^(CFR|CIF|CPT|CIP)$/.test(d.incoterm)?num(d.freight):0;
  var ins=/^(CIF|CIP)$/.test(d.incoterm)?num(d.insurance):0;
  return {sub:sub,fr:fr,ins:ins,total:sub+fr+ins,pk:pk,net:net,gr:gr,cbm:cbm};
}
var ONES=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
var TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function w999(n){var s="";if(n>=100){s+=ONES[Math.floor(n/100)]+" hundred";n%=100;if(n)s+=" "}if(n>=20){s+=TENS[Math.floor(n/10)];if(n%10)s+="-"+ONES[n%10]}else if(n)s+=ONES[n];return s}
function words(n){
  n=Math.round(n*100)/100;var whole=Math.floor(n),cents=Math.round((n-whole)*100);
  if(!whole&&!cents)return "Zero";
  var parts=[],units=[[1e9,"billion"],[1e6,"million"],[1e3,"thousand"]],w=whole;
  units.forEach(function(u){if(w>=u[0]){parts.push(w999(Math.floor(w/u[0]))+" "+u[1]);w%=u[0]}});
  if(w)parts.push(w999(w));
  var s=parts.join(" ")||"zero";
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(cents)s+=" and "+cents+"/100";
  return s;
}

/* ---------- checks against missing data ---------- */
function checks(d){
  var m=[],t=totals(d);
  if(!d.piNo)m.push("Proforma no is empty");
  if(!t.sub)m.push("No priced items yet");
  if(activeDoc==="pi"){var L=linkedConts(),lq=0;L.forEach(function(x){lq+=x.qty});var iq=0;d.items.forEach(function(it){iq+=num(it.qty)});if(L.length&&lq&&Math.abs(lq-iq)>0.001)m.push("Proforma quantity ("+nf2(iq)+") is different from the linked containers in the order plan ("+nf2(lq)+")")}
  d.items.forEach(function(it,i){if((it.desc||it.qty)&&num(it.gross)&&num(it.net)>num(it.gross))m.push("Item "+(i+1)+": net weight is more than gross weight")});
  if(activeDoc==="po"&&!d.poBank)m.push("Choose our bank for the PO");
  if(activeDoc==="po"&&!d.piNo)m.push("Proforma no is empty (the PO refers to it)");
  if(activeDoc==="po"&&!d.poNo)m.push("Our PO no is empty");
  if((activeDoc==="ci"||activeDoc==="pl")&&!d.bankPoNo)m.push("Bank PO no is empty");
  if(activeDoc!=="pi"&&activeDoc!=="po"&&!d.bankPoDate)m.push("Bank PO date is empty, so the invoice, packing list and waybill have no date");
  if(activeDoc==="wb"&&!d.twbNo)m.push("Truck waybill no is empty");


  if(/^(CIF|CIP)$/.test(d.incoterm)&&!num(d.insurance))m.push("Incoterm is "+d.incoterm+" but insurance charge is empty");
  return m;
}

function linkedConts(){

/* ---------- PDF downloads ---------- */
function baseName(){return slug(state.poNo&&activeDoc==="po"?state.poNo:(state.piNo||"shipment"))||"shipment"}
var busy=false;
async function makePdf(pages,filename){
  if(!downloads){setStatus("Downloads are not available in this view","err");return}
  if(!window.html2pdf){setStatus("The PDF engine did not load. Reload the page and try again.","err");return}
  if(busy)return;busy=true;setStatus("Making PDF…");
  var host=document.createElement("div");
  host.style.cssText="width:794px;background:#fff;margin:0;padding:0";
  host.innerHTML='<style>'+DOC_CSS+'.pg{width:794px;padding:30px 38px;background:#fff;box-sizing:border-box}.pg+.pg{break-before:page;page-break-before:always}.pg .v{min-height:1040px}</style>'+pages.map(function(p){return '<div class="pg">'+p+'</div>'}).join("");
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await Promise.all(Array.prototype.map.call(host.querySelectorAll("img"),function(im){return im.complete?null:new Promise(function(r){im.onload=im.onerror=r})}));
    var buf=await window.html2pdf().set({margin:0,image:{type:"jpeg",quality:0.97},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",scrollX:0,scrollY:0,windowWidth:794},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".tot",".words",".foot"]}}).from(host).outputPdf("arraybuffer");
    await downloads.save({filename:filename,data:buf});setStatus("Downloaded "+filename,"ok");
  }catch(e){
    if(e&&e.code==="declined")setStatus("Download cancelled");
    else if(e&&e.code==="rate_limited")setStatus("A download prompt is already open","err");
    else setStatus("Could not make the PDF. Try again.","err");
  }finally{busy=false}
}

if(window.claude&&window.claude.use){

<script>
(function(){
"use strict";
var db=null,products={},orders={},permits={},decls={},shipments={},cfilt={missing:true,q:""},settings={djbDays:30,ethDays:7,cocLead:10,bookLead:21};

var DSTAT=[["Draft","c-gray"],["Partial","c-amber"],["Cleared","c-green"],["Cancelled","c-red"]];
var ETH_BANKS=["Commercial Bank of Ethiopia","Cooperative Bank of Oromia","Awash Bank","Dashen Bank","Bank of Abyssinia","Wegagen Bank","Hibret Bank","Nib International Bank","Abay Bank","Bunna Bank","Berhan Bank","Zemen Bank","Oromia Bank","Enat Bank","Global Bank Ethiopia","Addis International Bank","Lion International Bank","Amhara Bank","Tsehay Bank","Siinqee Bank","Ahadu Bank","Gadaa Bank","Hijra Bank","ZamZam Bank","Goh Betoch Bank","Sidama Bank","Shabelle Bank","Tsedey Bank","Rammis Bank","Omo Bank"];
var STAGES=[["planned","Planned","c-gray"],["booked","Booked","c-blue"],["coc","COC issued","c-purple"],["loaded","Loaded","c-amber"],["djibouti","At Djibouti","c-teal"],["delivered","Arrived Ethiopia","c-green"]];

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0}

function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}

function ml(k){if(!k)return "No month";var p=k.split("-");return MN[+p[1]-1]+" "+p[0]}
function mAdd(k,n){var p=k.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function setStatus(t,c){var s=document.getElementById("opStatus");s.textContent=t;s.className="status"+(c?" "+c:"")}

/* ---------- calculations ---------- */
function nextOrderNo(){
  var best=null;
  Object.keys(orders).forEach(function(k){var no=String(orders[k].orderNo||""),m=/^(.*?)(\d+)$/.exec(no);if(!m)return;var n=parseInt(m[2],10);if(!best||n>best.n)best={pre:m[1],n:n,w:m[2].length}});
  if(!best)return "0001";
  return best.pre+String(best.n+1).padStart(best.w,"0");
}
function lineCalc(l){
  var p=products[l.productId]||{},c=num(l.containers);
  var qpc=l.qtyPerCont!==""&&l.qtyPerCont!=null?num(l.qtyPerCont):num(p.qtyPerCont);
  return {p:p,c:c,qpc:qpc,qty:c*qpc,pkg:c*num(p.pkgPerCont),net:c*num(p.netPerCont),kg:c*num(p.grossPerCont),missing:!p.name||!qpc||!num(p.pkgPerCont)||!num(p.grossPerCont)};
}
function contList(o){
  var old={};(o.containers||[]).forEach(function(c){old[c.key]=c});
  var out=[],seen={};
  (o.lines||[]).forEach(function(l){if(!l.productId)return;var n=Math.min(500,Math.max(0,Math.floor(num(l.containers))));
    for(var j=0;j<n;j++){var base=l.productId,idx=(seen[base]||0);seen[base]=idx+1;var key=base+"#"+idx;

}
function contCheck(c){
  var pm=permits[c.permitId],dc=decls[c.declId],sh=shipments[c.piId],r={pm:pm,dc:dc,sh:sh,noPi:!sh,noPermit:!pm,noDecl:!dc||dc.status==="Cancelled",mismatch:false,expired:false};
  if(pm&&dc&&dc.permitId&&dc.permitId!==c.permitId)r.mismatch=true;
  if(pm&&pm.expiry&&today()>pm.expiry)r.expired=true;
  return r;
}
function calc(o){
  var t={cont:0,qty:0,pkg:0,kg:0,net:0,lines:[],missing:false};
  (o.lines||[]).forEach(function(l){var r=lineCalc(l);t.lines.push(r);t.cont+=r.c;t.qty+=r.qty;t.pkg+=r.pkg;t.kg+=r.kg;t.net+=r.net;if(r.missing&&r.c)t.missing=true});
  var loadRef=o.loadedDate||o.planLoad;
  t.etaDjb=o.etaDjb||(loadRef?addDays(loadRef,settings.djbDays):"");
  t.etaDjbAuto=!o.etaDjb&&!!t.etaDjb;
  t.etaEth=o.etaEth||((o.ataDjb||t.etaDjb)?addDays(o.ataDjb||t.etaDjb,settings.ethDays):"");
  t.etaEthAuto=!o.etaEth&&!!t.etaEth;
  var st="planned";
  if(o.ataEth)st="delivered";else if(o.ataDjb)st="djibouti";else if(o.loadedDate)st="loaded";else if(o.cocStatus==="Issued")st="coc";else if(o.booked)st="booked";

  t.noPermit=np;t.noDecl=nd;t.noPi=npi;t.pis=Object.keys(pis);

    if(npi&&t.stageIdx>=1)al.push([t.stageIdx>=3?"red":"amber",npi+" container"+(npi>1?"s":"")+" not linked to a proforma"]);
    if(np){var urgent=t.stageIdx>=3||(o.planLoad&&diff(o.planLoad,td)<=settings.bookLead);if(urgent||t.stageIdx>=1)al.push([urgent?"red":"amber",np+" container"+(np>1?"s":"")+" without bank permit"])}
    if(nd&&t.stageIdx>=3)al.push([t.stageIdx>=4?"red":"amber",nd+" container"+(nd>1?"s":"")+" without customs declaration"]);
    if(mm)al.push(["amber",mm+" container"+(mm>1?"s have":" has")+" a declaration from a different bank permit"]);

  }

  t.arrMonth=(o.ataDjb||t.etaDjb||"").slice(0,7)||o.month||"";
  return t;
}
function chip(st){var s=STAGES.filter(function(x){return x[0]===st})[0]||STAGES[0];return '<span class="chip '+s[2]+'">'+s[1]+'</span>'}
function orderList(){return Object.keys(orders).map(function(k){return orders[k]})}

/* ---------- views ---------- */
function render(){

function dash(){

  var next=cs.filter(function(x){return !x[0].ataEth}).sort(function(a,b){return (a[1].etaDjb||"9999").localeCompare(b[1].etaDjb||"9999")}).slice(0,10);
  h+='<div class="card"><h2>Next arrivals</h2>'+(next.length?'<div class="tw"><table class="t"><thead><tr><th>Order</th><th>Products</th><th class="n">Containers</th><th>Status</th><th>ETA Djibouti</th><th>ETA Ethiopia</th></tr></thead><tbody>'+
    next.map(function(x){var o=x[0],t=x[1];return '<tr class="click" data-open="'+esc(o.id)+'"><td><b>'+esc(o.orderNo||"—")+'</b>'+(o.type==="additional"?' <span class="chip c-amber">Additional</span>':'')+'</td><td>'+prodSummary(t)+'</td><td class="n">'+nf(t.cont)+'</td><td>'+chip(t.stage)+(t.delayed?' <span class="chip c-red">Delayed</span>':'')+'</td><td>'+dateCell(o.ataDjb,t.etaDjb)+'</td><td>'+dateCell(o.ataEth,t.etaEth)+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="empty">No orders yet. Add your first planned order.</p>')+'</div>';
  return h;
  function k(v,l,a){return '<div class="kpi'+(a?' alert':'')+'"><b>'+nf(v)+'</b><span>'+l+'</span></div>'}
}
function dateCell(actual,planned){if(actual)return fd(actual)+'<div class="sub">actual</div>';if(planned)return fd(planned)+'<div class="sub">expected</div>';return '<span class="sub">—</span>'}
function prodSummary(t){if(!t.lines.length)return '<span class="sub">No products</span>';return t.lines.map(function(r){return esc(r.p.name||"Unknown product")+' <span class="sub">× '+nf(r.c)+'</span>'}).join("<br>")}
function monthChart(cs){
  var start=mAdd(today().slice(0,7),-2),months=[];for(var i=0;i<10;i++)months.push(mAdd(start,i));
  var data=months.map(function(m){var p=0,a=0;cs.forEach(function(x){if(x[1].arrMonth===m){if(x[0].type==="additional")a+=x[1].cont;else p+=x[1].cont}});return [m,p,a]});
  var max=Math.max(4,Math.max.apply(null,data.map(function(d){return d[1]+d[2]})));

    if(d[1])s+='<rect x="'+x+'" y="'+(base-hp)+'" width="'+w+'" height="'+hp+'" fill="var(--plan)" rx="2"/>';
    if(d[2])s+='<rect x="'+x+'" y="'+(base-hp-ha)+'" width="'+w+'" height="'+ha+'" fill="var(--add)" rx="2"/>';

}
function plan(){

    '<select id="fStatus" aria-label="Status"><option value="">All statuses</option>'+STAGES.map(function(s){return '<option value="'+s[0]+'"'+(filt.status===s[0]?" selected":"")+'>'+s[1]+'</option>'}).join("")+'</select>'+

  var cur=null,sum=null;

async function saveOrder(silent){silent=silent===true;

  if(!edit.month)return bad("Choose the plan month.");

  if(edit.ataDjb&&!edit.loadedDate)return bad("Enter the loading date before the Djibouti arrival date.");

  if(edit.loadedDate&&edit.ataDjb&&edit.ataDjb<edit.loadedDate)return bad("Djibouti arrival cannot be before loading.");
  var nos={},dup="";(edit.containers||[]).forEach(function(c){if(c.containerNo){if(nos[c.containerNo])dup=c.containerNo;nos[c.containerNo]=1}});
  if(dup)return bad("Container "+dup+" is entered twice.");

  edit.containers=contList(edit);
  var body=JSON.parse(JSON.stringify(edit));body.containers=body.containers.map(function(c){return {key:c.key,productId:c.productId,containerNo:c.containerNo||"",permitId:c.permitId||"",declId:c.declId||"",piId:c.piId||""}});body.lines=body.lines.filter(function(l){return l.productId||num(l.containers)});

}

<script>(function(){

  f.map(function(x){var d=x.d,i=x.i;return '<tr class="click" data-d="'+esc(x.id)+'">'+(canBatch?'<td><input type="checkbox" data-sel="'+esc(x.id)+'"'+(sel[x.id]?" checked":"")+' aria-label="Select '+esc(d.declNo)+'"></td>':'')+
    '<td><b>'+esc(d.declNo||"—")+'</b>'+(i.missing.length&&i.state!=="cancelled"?'<div class="sub" style="color:var(--amber)">Missing: '+esc(i.missing.join(", "))+'</div>':'')+'</td>'+
    '<td>'+(i.pm.permitNo?esc(i.pm.permitNo):'<span class="sub">—</span>')+'</td><td>'+(i.permitDate?fd(i.permitDate):'<span class="sub">—</span>')+'</td>'+
    '<td>'+(d.ciNo?esc(d.ciNo):'<span class="sub">—</span>')+'</td><td>'+esc(d.bankName||i.pm.bank||"")+'</td>'+
    '<td>'+(i.deadline?fd(i.deadline):'<span class="sub">—</span>')+(i.submitted?'<div class="sub">submitted '+fd(i.submitted)+'</div>':'')+'</td><td>'+daysCell(i)+'</td><td>'+chip(i.state)+'</td><td style="white-space:nowrap"><button type="button" class="btn mini" data-dact="edit" data-id="'+esc(x.id)+'">Edit</button> <button type="button" class="btn mini warn" data-dact="del" data-id="'+esc(x.id)+'">Delete</button></td></tr>'}).join("")+'</tbody></table></div>';

    '<p class="err" id="dErr" hidden></p></div>'+
    '<div class="dlg-f">'+(id?'<button type="button" class="btn warn" id="dDel">Delete declaration</button>':'')+'<span class="grow"></span><button type="button" class="btn" id="dCancel">Cancel</button><button type="button" class="btn primary" id="dSave">Save</button></div>'+
    '<datalist id="declCis">'+Object.keys(cis).map(function(n){return '<option value="'+esc(n)+'">'}).join("")+'</datalist><datalist id="declBanks">'+BANKS.map(function(b){return '<option value="'+esc(b)+'">'}).join("")+'</datalist>';
    f.querySelectorAll("[data-e]").forEach(function(el){
      var ev=el.tagName==="SELECT"||el.type==="date"?"change":"input";
      el.addEventListener(ev,function(){
        if(el.dataset.e==="permitId"&&el.value==="__new"){newPermit=true;de.permitId="";draw();return}
        if(el.dataset.e==="permitId")newPermit=false;
        de[el.dataset.e]=el.value;
        if(el.dataset.e==="permitId"&&!de.bankName&&permits[el.value])de.bankName=permits[el.value].bank||"";
        if(el.dataset.e==="ciNo"&&cis[el.value]&&!de.bankName)de.bankName=cis[el.value].bank;
        if(ev==="change")draw()});
      if(ev==="input"&&el.dataset.e==="ciNo")el.addEventListener("change",function(){var bn=f.querySelector('[data-e="bankName"]');if(bn&&!bn.value&&de.bankName)bn.value=de.bankName});
    });
    var e;
    if((e=$("npNo")))e.oninput=function(){np.no=this.value};
    if((e=$("npDate")))e.onchange=function(){np.date=this.value};
    $("dCanc").onchange=function(){de.status=this.checked?"Cancelled":"Cleared"};
    $("dX").onclick=$("dCancel").onclick=function(){$("declDlg").close()};
    $("dSave").onclick=save;
    if($("dDel"))$("dDel").onclick=function(){if(window.__armOnce(this))delD(id)};
  }
  async function save(){
    var err=$("dErr");function bad(m){err.textContent=m;err.hidden=false;err.scrollIntoView({block:"nearest"})}
    if(!de.declNo.trim())return bad("Declaration no is required.");
    if(!newPermit&&!de.permitId)return bad("Bank permit is required.");
    if(newPermit&&(!np.no.trim()||!np.date))return bad("Enter the new bank permit no and its approval date.");
    if(!(de.ciNo||"").trim())return bad("Commercial invoice no is required.");
    var pmBank=de.permitId&&permits[de.permitId]?permits[de.permitId].bank:"";
    if(!(de.bankName||"").trim()&&!pmBank)return bad("Bank name is required.");
    if(!de.bankName)de.bankName=pmBank;
    var dup=Object.keys(decls).some(function(k){return k!==id&&(decls[k].declNo||"").trim().toUpperCase()===de.declNo.trim().toUpperCase()});if(dup)return bad("This declaration no already exists.");
    if(!db)return bad("Saving is not available in this view.");
    try{
      if(newPermit){
        var ex=Object.keys(permits).filter(function(k){return (permits[k].permitNo||"").trim().toUpperCase()===np.no.trim().toUpperCase()})[0];
        if(ex){de.permitId=ex}else{var r=await db.collection("permits").add({permitNo:np.no.trim(),bank:de.bankName,date:np.date,expiry:"",amount:"",currency:"USD",piNo:(cis[de.ciNo]||{}).pi||"",notes:"Added from Declarations"});de.permitId=r.id}
      }
      var pi=info(de);if(de.submittedDate&&pi.permitDate&&de.submittedDate<pi.permitDate)return bad("Submission date cannot be before the bank permit approval date.");
      var b=JSON.parse(JSON.stringify(de));delete b.id;
      if(id)await db.doc("declarations/"+id).set(b);else await db.collection("declarations").add(b);
      $("declDlg").close();setStatus("Declaration "+b.declNo+" saved","ok");
    }catch(x){bad("Could not save. Try again.")}
  }
  draw();dlgShow();
}
document.querySelectorAll("#declApp .nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;sel={};render()}});
$("declAdd").onclick=function(){openD(null)};
$("declDlg").addEventListener("close",render);
window.__decl={onShow:render};
render();
if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(d){
    db=d;if(!d){setStatus("Saving is not available in this view","err");return}
    setStatus("");
    function live(){if(!$("declDlg").open)render()}
    d.collection("declarations").onSnapshot(function(s){decls={};s.docs.forEach(function(x){var b=x.data();if(b)decls[x.id]=b});live()},function(){});
    d.collection("permits").onSnapshot(function(s){permits={};s.docs.forEach(function(x){var b=x.data();if(b)permits[x.id]=b});live()},function(){});
    d.collection("orders").onSnapshot(function(s){orders={};s.docs.forEach(function(x){var b=x.data();if(b)orders[x.id]=b});live()},function(){});
    d.collection("shipments").onSnapshot(function(s){ships={};s.docs.forEach(function(x){var b=x.data();if(b)ships[x.id]=b});live()},function(){});
    d.doc("settings/delinquency").onSnapshot(function(s){if(s.exists)cfg=Object.assign(cfg,s.data());live()},function(){});
  });
}else setStatus("Saving is not available in this view","err");
})();
</script>
<script>(function(){
"use strict";
var COLS=[["orders","Orders"],["products","Products"],["shipments","Proformas"],["fcy","FCY workflows"],["permits","Bank permits"],["declarations","Declarations"],["settings","Settings"],["vendors","Vendors"]];
var db=null,downloads=null,lastAt="",pending=null;
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function stamp(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdt(iso){if(!iso)return "never";var d=new Date(iso);if(isNaN(d))return iso;return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
function msg(t,cls){var m=$("bkMsg");m.textContent=t;m.className="bk-msg"+(cls?" "+cls:"")}
function badge(){var b=$("backupBtn");if(!b)return;var old=daysSince(lastAt)>30;b.classList.toggle("due",old);b.title=old?"No backup in the last 30 days":"Last backup "+fdt(lastAt)}
async function readAll(){
  var out={app:"baraka-import-system",version:1,exportedAt:new Date().toISOString(),collections:{}},counts={};
  for(var i=0;i<COLS.length;i++){var c=COLS[i][0];var snap=await db.collection(c).get();var m={};snap.docs.forEach(function(d){var v=d.data();if(v)m[d.id]=v});out.collections[c]=m;counts[c]=Object.keys(m).length}
  return {data:out,counts:counts};
}
async function markDone(){lastAt=new Date().toISOString();try{await db.doc("settings/backup").set({lastAt:lastAt})}catch(e){}badge();draw()}
function draw(counts){
  var f=$("bkBody");
  f.innerHTML='<div class="bk-sec"><h3>Where your data is saved</h3><p>Every time you click Save, the record is stored immediately on the system&#39;s server and is shared with everyone using the system. Nothing is kept only on your computer.</p>'+
  '<p class="bk-last">Last backup: <b>'+esc(fdt(lastAt))+'</b>'+(daysSince(lastAt)>30?' <span class="bk-due">Backup recommended</span>':'')+'</p>'+
  (counts?'<div class="bk-counts">'+COLS.map(function(c){return '<div><b>'+(counts[c[0]]||0)+'</b><span>'+c[1]+'</span></div>'}).join("")+'</div>':'')+'</div>'+
  '<div class="bk-sec"><h3>Make a backup</h3><p>Download a copy of all records. Keep it on your computer and a second place, such as a USB drive or email. We recommend once a month.</p>'+
  '<div class="bk-row"><button type="button" class="bk-btn primary" id="bkJson">Download backup file (.json)</button><button type="button" class="bk-btn" id="bkXlsx">Download Excel copy (.xlsx)</button></div>'+
  '<p class="bk-note">The backup file can be restored into the system. The Excel copy is for reading and reports.</p></div>'+
  '<div class="bk-sec"><h3>Restore from a backup</h3><p>Choose a backup file (.json). Records in the file replace records with the same number in the system. Records not in the file are not touched.</p>'+
  '<div class="bk-row"><input type="file" id="bkFile" accept=".json,application/json"><button type="button" class="bk-btn warn" id="bkRestore"'+(pending?"":" disabled")+'>Restore'+(pending?" "+pending.total+" records":"")+'</button></div>'+
  (pending?'<p class="bk-note">File from '+esc(fdt(pending.data.exportedAt))+': '+COLS.map(function(c){return (pending.counts[c[0]]||0)+" "+c[1].toLowerCase()}).join(", ")+'.</p>':'')+'</div>';
  $("bkJson").onclick=doJson;$("bkXlsx").onclick=doXlsx;
  $("bkFile").onchange=pickFile;$("bkRestore").onclick=doRestore;
}
async function doJson(){
  if(!db)return msg("Saving is not available in this view.","err");
  if(!downloads)return msg("Downloads are not available in this view.","err");
  msg("Preparing backup…");
  try{var r=await readAll();await downloads.save({filename:"baraka-backup-"+stamp()+".json",data:JSON.stringify(r.data,null,1)});await markDone();draw(r.counts);msg("Backup downloaded. Keep it somewhere safe.","ok")}
  catch(e){msg(e&&e.code==="declined"?"Download cancelled.":"Could not make the backup. Try again.","err")}
}
function loadXlsx(){return new Promise(function(res,rej){if(window.XLSX)return res();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function flat(v){if(v==null)return "";if(typeof v==="string")return /^data:image\//.test(v)?"[image]":v.slice(0,32000);if(typeof v!=="object")return v;return JSON.stringify(v,function(k,x){return typeof x==="string"&&/^data:image\//.test(x)?"[image]":x}).slice(0,32000)}
async function doXlsx(){
  if(!db)return msg("Saving is not available in this view.","err");
  if(!downloads)return msg("Downloads are not available in this view.","err");
  msg("Preparing Excel copy…");
  try{
    await loadXlsx();var r=await readAll(),wb=XLSX.utils.book_new();
    COLS.forEach(function(c){var m=r.data.collections[c[0]]||{},ids=Object.keys(m);if(!ids.length)return;
      var keys={};ids.forEach(function(id){Object.keys(m[id]).forEach(function(k){keys[k]=1})});var ks=Object.keys(keys);
      var rows=ids.map(function(id){var o={id:id};ks.forEach(function(k){o[k]=flat(m[id][k])});return o});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),c[1].slice(0,31))});
    if(!wb.SheetNames.length)return msg("There are no records to export yet.","err");
    var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    await downloads.save({filename:"baraka-records-"+stamp()+".xlsx",data:buf});draw(r.counts);msg("Excel copy downloaded.","ok");
  }catch(e){msg(e&&e.code==="declined"?"Download cancelled.":"Could not make the Excel copy. Check the internet connection and try again.","err")}
}
function pickFile(){
  var f=this.files&&this.files[0];pending=null;if(!f){draw();return}
  var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d||d.app!=="baraka-import-system"||!d.collections)throw 0;
      var counts={},total=0;COLS.forEach(function(c){var n=Object.keys(d.collections[c[0]]||{}).length;counts[c[0]]=n;total+=n});
      pending={data:d,counts:counts,total:total};draw();msg("Backup file read. Click Restore to load it.")}
    catch(e){draw();msg("This is not a Baraka backup file.","err")}};
  rd.readAsText(f);
}
async function doRestore(){
  if(!pending)return;if(!db)return msg("Saving is not available in this view.","err");
  if(!window.__armOnce(this)){this.textContent="Click again to restore";return}
  msg("Restoring…");var n=0;
  try{for(var i=0;i<COLS.length;i++){var c=COLS[i][0],m=pending.data.collections[c]||{};for(var id in m){await db.doc(c+"/"+id).set(m[id]);n++}}
    pending=null;var r=await readAll();draw(r.counts);msg(n+" records restored.","ok")}
  catch(e){msg("Stopped after "+n+" records. Try again.","err")}
}
async function open(){
  $("bkDlg").showModal();draw();msg("");
  if(db){try{var r=await readAll();draw(r.counts)}catch(e){}}
}
$("backupBtn").onclick=open;
$("bkClose").onclick=function(){$("bkDlg").close()};
if(window.claude&&window.claude.use){
  window.claude.use("downloads").then(function(d){downloads=d});
  window.claude.use("db").then(function(d){db=d;if(!d)return;d.doc("settings/backup").onSnapshot(function(s){lastAt=s.exists&&s.data()?s.data().lastAt||"":"";badge()},function(){})});
}
})();
</script>
<script>
(function(){
  function sw(m){
    if(["plan","docs","fcy","decl"].indexOf(m)<0)m="plan";var plan=m==="plan";
    document.getElementById("declApp").hidden=m!=="decl";if(m==="decl"&&window.__decl)window.__decl.onShow();
    document.getElementById("opApp").hidden=!plan;document.getElementById("docApp").hidden=m!=="docs";document.getElementById("fcyApp").hidden=m!=="fcy";
    if(m==="fcy"&&window.__fcy)window.__fcy.onShow();
    document.querySelectorAll(".appsw [data-app]").forEach(function(b){b.setAttribute("aria-current",String(b.dataset.app===m))});
    try{localStorage.setItem("baraka-app",m)}catch(e){}
    if(plan&&window.__op&&window.__op.onShow)window.__op.onShow();
    window.scrollTo(0,0);
  }
  window.__switchApp=sw;
  function arm(btn){btn.dataset.armed="1";btn._txt=btn.textContent;btn.textContent="Click again to delete";btn.style.background="#A32D2D";btn.style.color="#fff";btn.style.borderColor="#A32D2D";
    btn._t=setTimeout(function(){disarm(btn)},4000)}
  function disarm(btn){clearTimeout(btn._t);btn.dataset.armed="";if(btn._txt)btn.textContent=btn._txt;btn.style.background="";btn.style.color="";btn.style.borderColor=""}
  window.__armOnce=function(btn){if(btn&&btn.dataset.armed==="1"){disarm(btn);return true}if(btn)arm(btn);return false};
  document.querySelectorAll(".appsw [data-app]").forEach(function(b){b.onclick=function(){sw(b.dataset.app)}});
  var m="plan";try{m=localStorage.getItem("baraka-app")||"plan"}catch(e){}
  sw(m);
})();
</script>
